<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Management - Authentication</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            padding: 40px;
        }

        .form-container {
            display: none;
        }

        .form-container.active {
            display: block;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .toggle-form {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }

        .toggle-form button {
            background: none;
            color: #667eea;
            padding: 0;
            font-weight: 600;
            margin-left: 5px;
            text-decoration: underline;
            width: auto;
            box-shadow: none;
        }

        .toggle-form button:hover {
            transform: none;
            box-shadow: none;
        }

        .message {
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 14px;
            display: none;
        }

        .message.show {
            display: block;
        }

        .message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .dashboard {
            display: none;
        }

        .dashboard.active {
            display: block;
        }

        .user-info {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }

        .user-info p {
            margin: 8px 0;
            color: #555;
            font-size: 14px;
        }

        .user-info strong {
            color: #333;
        }

        .logout-btn {
            background: #dc3545;
            margin-top: 20px;
        }

        .logout-btn:hover {
            box-shadow: 0 5px 20px rgba(220, 53, 69, 0.4);
        }

        .loading {
            display: inline-block;
            opacity: 0.7;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login Form -->
        <div class="form-container active" id="loginForm">
            <h1>Login</h1>
            <div class="message" id="loginMessage"></div>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" required>
                </div>
                <button type="submit" id="loginBtn">Login</button>
            </form>
            <div class="toggle-form">
                Don't have an account?
                <button type="button" onclick="toggleForms()">Register</button>
            </div>
        </div>

        <!-- Register Form -->
        <div class="form-container" id="registerForm">
            <h1>Register</h1>
            <div class="message" id="registerMessage"></div>
            <form onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="registerUsername">Username</label>
                    <input type="text" id="registerUsername" required>
                </div>
                <div class="form-group">
                    <label for="registerEmail">Email</label>
                    <input type="email" id="registerEmail" required>
                </div>
                <div class="form-group">
                    <label for="registerPassword">Password</label>
                    <input type="password" id="registerPassword" required minlength="6">
                </div>
                <div class="form-group">
                    <label for="registerRole">Role</label>
                    <select id="registerRole">
                        <option value="member">Member</option>
                        <option value="manager">Manager</option>
                    </select>
                </div>
                <button type="submit" id="registerBtn">Register</button>
            </form>
            <div class="toggle-form">
                Already have an account?
                <button type="button" onclick="toggleForms()">Login</button>
            </div>
        </div>

        <!-- Dashboard -->
        <div class="dashboard" id="dashboard">
            <h1>Welcome! 👋</h1>
            <div class="user-info" id="userInfo"></div>
            <button type="button" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; width: 100%; padding: 12px; margin-top: 10px;" onclick="goToTeams()">Manage Teams</button>
            <button type="button" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; width: 100%; padding: 12px; margin-top: 10px;" onclick="goToNotes()">📝 Notes & Folders</button>
            <button type="button" style="background: #198754; color: white; width: 100%; padding: 12px; margin-top: 10px;" onclick="goToImportUsers()">Bulk Import Users</button>
            <button type="button" class="logout-btn" onclick="handleLogout()">Logout</button>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8080';

        function toggleForms() {
            document.getElementById('loginForm').classList.toggle('active');
            document.getElementById('registerForm').classList.toggle('active');
            clearMessages();
        }

        function showMessage(elementId, message, type) {
            const messageEl = document.getElementById(elementId);
            messageEl.textContent = message;
            messageEl.className = `message show ${type}`;
        }

        function clearMessages() {
            document.getElementById('loginMessage').className = 'message';
            document.getElementById('registerMessage').className = 'message';
        }

        async function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginBtn');

            btn.disabled = true;
            btn.textContent = 'Logging in...';

            try {
                const response = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    showMessage('loginMessage', data.error || 'Login failed', 'error');
                    return;
                }

                localStorage.setItem('token', data.token);
                showMessage('loginMessage', 'Login successful! Loading...', 'success');
                setTimeout(() => {
                    showDashboard();
                }, 500);
            } catch (error) {
                showMessage('loginMessage', 'Network error. Please try again.', 'error');
                console.error('Error:', error);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Login';
            }
        }

        async function handleRegister(event) {
            event.preventDefault();
            const username = document.getElementById('registerUsername').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const role = document.getElementById('registerRole').value;
            const btn = document.getElementById('registerBtn');

            btn.disabled = true;
            btn.textContent = 'Registering...';

            try {
                const response = await fetch(`${API_BASE_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password, role })
                });

                const data = await response.json();

                if (!response.ok) {
                    showMessage('registerMessage', data.error || 'Registration failed', 'error');
                    return;
                }

                showMessage('registerMessage', 'Registration successful! Please login.', 'success');
                setTimeout(() => {
                    toggleForms();
                    document.getElementById('loginEmail').value = email;
                }, 1500);
            } catch (error) {
                showMessage('registerMessage', 'Network error. Please try again.', 'error');
                console.error('Error:', error);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Register';
            }
        }

        async function fetchUserInfo() {
            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`${API_BASE_URL}/api/me`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) {
                    throw new Error('Failed to fetch user info');
                }

                const data = await response.json();
                return data;
            } catch (error) {
                console.error('Error fetching user info:', error);
                return null;
            }
        }

        async function showDashboard() {
            const userInfo = await fetchUserInfo();
            
            document.getElementById('loginForm').classList.remove('active');
            document.getElementById('registerForm').classList.remove('active');
            document.getElementById('dashboard').classList.add('active');

            if (userInfo) {
                const userInfoEl = document.getElementById('userInfo');
                userInfoEl.innerHTML = `
                    <p><strong>User ID:</strong> ${userInfo.user_id}</p>
                    <p><strong>Role:</strong> ${userInfo.role}</p>
                    <p><strong>Message:</strong> ${userInfo.message}</p>
                `;
            }
        }

        function handleLogout() {
            localStorage.removeItem('token');
            document.getElementById('dashboard').classList.remove('active');
            document.getElementById('loginForm').classList.add('active');
            document.getElementById('loginEmail').value = '';
            document.getElementById('loginPassword').value = '';
            clearMessages();
        }

        function goToTeams() {
            globalThis.location.href = '/team.html';
        }

        function goToNotes() {
            globalThis.location.href = '/notes.html';
        }

        function goToImportUsers() {
            globalThis.location.href = '/import-users.html';
        }

        // Check if already logged in on page load
        window.addEventListener('load', () => {
            const token = localStorage.getItem('token');
            if (token) {
                showDashboard();
            }
        });
    </script>
</body>
</html>
