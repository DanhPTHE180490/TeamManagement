name: Go Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Run Go Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Create .env file
        run: |
          cat << EOF > .env
          DB_USER=root
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=microservices_capstone
          DB_HOST=127.0.0.1
          DB_PORT=3307
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          DB_DSN=root:${{ secrets.DB_PASSWORD }}@tcp(127.0.0.1:3307)/microservices_capstone?parseTime=true
          EOF

      - name: Start services via Docker Compose
        run: docker compose up --wait

      - name: Run tests
        run: go test ./... -v -p 1
        
      - name: Tear down Docker Compose
        if: always()
        run: docker compose down