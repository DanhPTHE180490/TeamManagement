version: '3.8'

services:
  # 1. The Database Service
  db:
    image: mysql:8.0
    container_name: team_management_db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3307:3306"
    volumes:
      - ./database.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      timeout: 10s
      retries: 5

  # 2. The Go API Service
  api:
    build: .
    container_name: team_management_api
    ports:
      - "8080:8080"
    environment:
      - DB_DSN=root:${DB_PASSWORD}@tcp(db:3306)/${DB_NAME}?parseTime=true
    depends_on:
      db:
        condition: service_healthy